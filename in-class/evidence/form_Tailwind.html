<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no" name="viewport">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script/tailwind.config.js"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <title>Title</title>
</head>
<body class="bg-warm-gray-100">
<div class="container mx-auto px-4 py-4 space-y-4 shadow-lg rounded-lg bg-warm-gray-50 max-w-md my-4">
    <h1 class="text-2xl font-bold text-center text-gray-800">User Information</h1>
    <form>
        <span class="block m-2">
            <label class="font-semibold text-gray-700">Name</label>
            <br>
            <input name="fullname" type="text" class="border border-gray-300 rounded-md px-2 py-1 w-full" placeholder="Enter your name">
        </span>
        <span class="block m-2">
            <label class="font-semibold text-gray-700">Age</label>
            <br>
            <input name="age" type="number" class="border border-gray-300 rounded-md px-2 py-1 w-full" placeholder="Enter your age">
        </span>
        <span class="block m-2">
            <label class="font-semibold text-gray-700">Language</label>
            <br>
            <select name="lang" class="border border-gray-300 rounded-md px-2 py-1 w-full">
                <option value="en">English</option>
                <option value="fr">French</option>
                <option value="es">Spanish</option>
                <option value="it">Italian</option>
                <option value="de">German</option>
            </select>
        </span>
        <span class="block m-2">
            <label class="font-semibold text-gray-700">Bio</label>
            <br>
            <textarea name="bio" class="border border-gray-300 rounded-md px-2 py-1 w-full" placeholder="Tell us a bit about yourself"></textarea>
        </span>
        <span class="block m-2">
            <input type="submit" value="Submit" class="bg-blue-500 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg w-full">
        </span>
    </form>
</div>
</body>
</html>
