<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no" name="viewport">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>TVtastic - Shows</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script crossorigin="anonymous" src="https://kit.fontawesome.com/53291f9112.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-slate-800 dark:text-slate-200" id="shows-page">
<div class="jumbotron">
    <div class="mx-4 rounded-b-xl bg-gray-100 shadow-md dark:bg-slate-900">
        <nav>
            <div class="container mx-auto flex gap-4 px-4 py-2 flex-wrap md:flex-nowrap">
                <a class="brandlink text-4xl font-semibold text-gray-700 dark:text-slate-200 hover:text-indigo-600
                dark:hover:text-indigo-400 hover:scale-110 hover:tracking-wider transition-all"
                   href="index.html">TVtastic</a>

                <button class="ml-auto items-center rounded p-2 text-gray-800 hover:bg-gray-200 dark:text-slate-200
                dark:hover:bg-slate-700 md:hidden self-center"
                        onclick="this.nextElementSibling.classList.toggle('hidden')">
                    <i class="fa-solid fa-bars !text-gray-800 dark:!text-slate-200"></i>
                </button>

                <div class="hidden flex-auto md:block self-center" id="navbarNav">
                    <ul class="flex flex-col gap-2 md:flex-row md:justify-end md:gap-4">
                        <li>
                            <a class="text-gray-700 hover:text-indigo-600 dark:text-slate-200 dark:hover:text-indigo-400"
                               href="index.html">
                                <i class="fa-solid fa-house mr-2"></i>Home
                            </a>
                        </li>
                        <li>
                            <a class="text-gray-700 hover:text-indigo-600 dark:text-slate-200 dark:hover:text-indigo-400"
                               href="shows.html">
                                <i class="fa-solid fa-tv mr-2"></i>Shows
                            </a>
                        </li>
                        <li>
                            <a class="text-gray-700 hover:text-indigo-600 dark:text-slate-200 dark:hover:text-indigo-400"
                               href="actors.html">
                                <i class="fa-solid fa-image-portrait mr-2"></i>Actors
                            </a>
                        </li>
                        <li>
                            <a class="text-gray-700 hover:text-indigo-600 dark:text-slate-200 dark:hover:text-indigo-400"
                               href="schedule.html">
                                <i class="fa-solid fa-calendar mr-2"></i>Schedule
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>

<form class="mx-auto mt-4 w-full px-4 md:w-3/4 lg:w-1/2"
      id="search-form"
      onsubmit="searchShows(event)">
    <div class="grid grid-cols-1 gap-2 sm:grid-cols-9 sm:gap-0">
        <input class="h-full w-full rounded-full border border-gray-300 px-3 py-2 text-sm text-gray-800 focus:outline-none focus:ring-1 focus:ring-blue-500 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-200 sm:col-span-8 sm:rounded-l-full sm:rounded-r-none"
               id="keywords"
               placeholder="Enter search here…"
               type="text">

        <button class="h-full w-full rounded-full bg-indigo-600 px-3 py-2 text-sm text-white hover:bg-indigo-700 sm:col-span-1 sm:rounded-l-none sm:rounded-r-full"
                type="submit">
            Search
        </button>
    </div>

    <div class="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4">
        <select class="w-full rounded border border-gray-300 px-2 py-2 text-sm text-gray-800 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-200"
                id="genre-filter">
            <option value="">Any genre</option>
            <option value="Action">Action</option>
            <option value="Adventure">Adventure</option>
            <option value="Anime">Anime</option>
            <option value="Comedy">Comedy</option>
            <option value="Crime">Crime</option>
            <option value="Drama">Drama</option>
            <option value="Fantasy">Fantasy</option>
            <option value="Horror">Horror</option>
            <option value="Mystery">Mystery</option>
            <option value="Romance">Romance</option>
            <option value="Science-Fiction">Science-Fiction</option>
            <option value="Thriller">Thriller</option>
        </select>

        <select class="w-full rounded border border-gray-300 px-2 py-2 text-sm text-gray-800 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-200"
                id="status-filter">
            <option value="">Any status</option>
            <option value="Running">Running</option>
            <option value="Ended">Ended</option>
        </select>

        <select class="w-full rounded border border-gray-300 px-2 py-2 text-sm text-gray-800 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-200"
                id="rating-filter">
            <option value="">Any rating</option>
            <option value="5">5+</option>
            <option value="6">6+</option>
            <option value="7">7+</option>
            <option value="8">8+</option>
            <option value="9">9+</option>
        </select>

        <select class="w-full rounded border border-gray-300 px-2 py-2 text-sm text-gray-800 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-200"
                id="language-filter">
            <option value="">Any language</option>
            <option value="English">English</option>
            <option value="Japanese">Japanese</option>
            <option value="Korean">Korean</option>
            <option value="Spanish">Spanish</option>
            <option value="French">French</option>
            <option value="German">German</option>
        </select>
    </div>
</form>

<div class="mx-2 my-4 hidden rounded-xl bg-gray-100 p-3 shadow-md dark:bg-slate-700 sm:mx-4 md:container md:mx-auto md:p-4"
     id="shows-container">
    <h2 class="pb-4 text-center text-xl font-semibold md:text-2xl">Result</h2>
    <div class="grid grid-cols-1 gap-4 p-2 sm:grid-cols-2 md:p-4 lg:grid-cols-4" id="shows">
    </div>
</div>

<script src="./js/shows.js"></script>
</body>
</html>
