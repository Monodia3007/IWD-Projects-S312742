<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no" name="viewport">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>TVtastic</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script crossorigin="anonymous" src="https://kit.fontawesome.com/53291f9112.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-slate-800 dark:text-slate-200" id="home-page">
<div class="jumbotron">
    <div class="mx-4 rounded-b-xl bg-gray-100 shadow-md dark:bg-slate-900">
        <nav>
            <div class="container mx-auto flex gap-4 px-4 py-2 flex-wrap md:flex-nowrap">
                <a class="brandlink text-xl font-semibold text-gray-700 dark:text-slate-200 hover:text-indigo-600
                dark:hover:text-indigo-400 hover:scale-110 hover:tracking-wider hover:italic transition-all"
                   href="index.html">TVtastic</a>

                <button class="ml-auto items-center rounded p-2 text-gray-800 hover:bg-gray-200 dark:text-slate-200
                dark:hover:bg-slate-700 md:hidden"
                        onclick="this.nextElementSibling.classList.toggle('hidden')">
                    <i class="fa-solid fa-bars !text-gray-800 dark:!text-slate-200"></i>
                </button>

                <div class="hidden flex-auto md:block" id="navbarNav">
                    <ul class="flex flex-col gap-2 md:flex-row md:justify-end md:gap-4">
                        <li>
                            <a class="text-gray-700 hover:text-indigo-600 dark:text-slate-200 dark:hover:text-indigo-400"
                               href="index.html">
                                <i class="fa-solid fa-house mr-2"></i>Home
                            </a>
                        </li>
                        <li>
                            <a class="text-gray-700 hover:text-indigo-600 dark:text-slate-200 dark:hover:text-indigo-400"
                               href="shows.html">
                                <i class="fa-solid fa-tv mr-2"></i>Shows
                            </a>
                        </li>
                        <li>
                            <a class="text-gray-700 hover:text-indigo-600 dark:text-slate-200 dark:hover:text-indigo-400"
                               href="actors.html">
                                <i class="fa-solid fa-image-portrait mr-2"></i>Actors
                            </a>
                        </li>
                        <li>
                            <a class="text-gray-700 hover:text-indigo-600 dark:text-slate-200 dark:hover:text-indigo-400"
                               href="schedule.html">
                                <i class="fa-solid fa-calendar mr-2"></i>Schedule
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>

    <div class="mb-4 p-6 md:p-12">
        <h1 class="text-3xl md:text-5xl font-bold">Welcome to TVtastic</h1>
        <p class="text-lg md:text-2xl md:w-2/3">
            Look up the latest shows, actors and see the schedules
        </p>
    </div>
</div>

<div class="container mx-auto my-4 grid size-full content-center px-4 grid-cols-1 divide-y md:grid-cols-2 md:divide-x
md:divide-y-0 divide-slate-600">
    <div class="container bg-gray-100 p-4 dark:bg-slate-700 rounded-t-xl md:rounded-l-xl md:rounded-tr-none">
        <h2 class="pb-4 text-center text-2xl font-semibold">Top Shows</h2>
        <div class="grid grid-cols-1 p-4 md:grid-cols-2 " id="shows">
        </div>
    </div>
    <div class="container bg-gray-100 p-4 dark:bg-slate-700 rounded-b-xl md:rounded-r-xl md:rounded-bl-none">
        <h2 class="pb-4 text-center text-2xl font-semibold">Actors</h2>
        <div class="grid grid-cols-1 p-4 md:grid-cols-2" id="actors">
        </div>
    </div>
</div>

<script src="./js/index.js"></script>
</body>
</html>
